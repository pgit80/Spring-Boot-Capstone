server.port=8083

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always
spring.jpa.show-sql=true

#For testing in vm-> `http://localhost:8081/material` 
#MaterialServiceConsumer.serviceURL=http://localhost:8081/material

# For testing in Local system with individual ports-> `http://localhost:8888` 
MaterialServiceConsumer.serviceURL=http://localhost:8888

MaterialCategoryConsumer.apiURL=/controller/getMaterialCategories
MaterialCategoryConsumer.apiURLForById=/controller/getMaterialCategoryById/


MaterialTypeConsumer.apiURL=/type/controller/getTypeDetails
MaterialTypeConsumer.apiURLByCategoryId=/type/controller/getTypeDetailsByCategoryId/

UnitServiceConsumer.apiURL=/unit/controller/getUnitDetails
UnitServiceConsumer.apiURLByCategoryId=/unit/controller/getUnitsByCategoryId/

#For testing in vm-> `http://localhost:8081/vendor` uncomment line 30 and comment line 32
#VendorServiceConsumer.serviceURL=http://localhost:8081/vendor
#For testing in local system with individual ports-> `http://localhost:8087` 
VendorServiceConsumer.serviceURL=http://localhost:8087

VendorServiceConsumer.apiURL=/controller/getVendors
# fixed the url endpoints to match the actual services